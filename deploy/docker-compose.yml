# Müşteri başına VPS kurulumu: uygulama + Postgres + şifreli yedek + Caddy (otomatik TLS).
# Kullanım: deploy/README.md
name: uretim-platformu

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: uretim
      POSTGRES_USER: uretim_owner
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD gerekli}
      # Uygulama rolü (süper kullanıcı değil) veritabanı ilk oluşturulurken db-init ile açılır.
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD gerekli}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U uretim_owner -d uretim']
      interval: 10s
      retries: 10
    # Port dışarı açılmaz: yalnızca iç ağdan erişilir.

  app:
    build: { context: .., target: app }
    restart: unless-stopped
    env_file: kurulum.env
    environment:
      DATABASE_URL: postgres://uretim_app:${APP_DB_PASSWORD}@db:5432/uretim
      DB_APP_ROLE: app_user
      INSTALL_CONFIG_PATH: /config/kurulum.config.json
      STORAGE_DRIVER: ${STORAGE_DRIVER:-fs}
      STORAGE_FS_DIR: /files
    volumes:
      - ./kurulum.config.json:/config/kurulum.config.json:ro
      - files:/files
    read_only: true
    tmpfs: [/tmp]
    depends_on:
      db: { condition: service_healthy }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN gerekli}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [app]

  backup:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: uretim_owner
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: uretim
      YEDEK_ACIK_ANAHTAR: ${YEDEK_ACIK_ANAHTAR:?YEDEK_ACIK_ANAHTAR gerekli (age açık anahtarı)}
    volumes:
      - ./backup:/scripts:ro
      - backups:/yedek
      - files:/files:ro
    entrypoint: ['/bin/sh', '/scripts/zamanla.sh']
    depends_on:
      db: { condition: service_healthy }

  # Geri yükleme (yalnızca gerektiğinde): docker compose --profile restore run --rm restore /yedek/<dosya>.tar.age
  # age gizli anahtarı sunucuda tutulmaz; geri yükleme anında ./age.key olarak koyulur ve sonra silinir.
  restore:
    image: postgres:17-alpine
    profiles: [restore]
    environment:
      PGHOST: db
      PGUSER: uretim_owner
      PGPASSWORD: ${DB_PASSWORD}
      PGDATABASE: uretim
    volumes:
      - ./backup:/scripts:ro
      - backups:/yedek:ro
      - files:/files
      - ./age.key:/anahtar/age.key:ro
    entrypoint: ['/bin/sh', '-c', 'apk add --no-cache age >/dev/null && /bin/sh /scripts/geri-yukle.sh "$0" /anahtar/age.key']
    depends_on:
      db: { condition: service_healthy }

  # Tek seferlik komutlar: docker compose run --rm tools pnpm kurulum
  tools:
    build: { context: .., target: tools }
    profiles: [tools]
    env_file: kurulum.env
    environment:
      DATABASE_URL: postgres://uretim_app:${APP_DB_PASSWORD}@db:5432/uretim
      INSTALL_CONFIG_PATH: /config/kurulum.config.json
    volumes:
      - ./kurulum.config.json:/config/kurulum.config.json:ro
    depends_on:
      db: { condition: service_healthy }

volumes:
  db-data:
  files:
  backups:
  caddy-data:
  caddy-config:
